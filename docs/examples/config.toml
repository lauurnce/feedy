# Example ~/.feedy/config.toml — copy and edit to taste.
# Every key below is optional; omitting one falls back to its default.

# Which sources to fetch and include in the digest.
sources = ["hackernews", "anthropic", "openai"]

# Digest format: "markdown" (default) or "plain".
output_format = "markdown"

[anthropic]
# Used for AI summaries.
api_key = ""
# The ANTHROPIC_API_KEY environment variable takes precedence over this value.
